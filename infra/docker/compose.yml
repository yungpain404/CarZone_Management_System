name: car_zone_compose # Tên của Docker Compose project

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest # Image SQL Server 2022 chính thức từ Microsoft
    container_name: carzone_sqlserver # Tên cố định cho container SQL Server
    environment:
      ACCEPT_EULA: "Y" # Bắt buộc: đồng ý điều khoản sử dụng của Microsoft
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD} # Mật khẩu tài khoản sa, lấy từ file .env
      MSSQL_PID: Developer # Phiên bản Developer (miễn phí, đầy đủ tính năng, dùng cho dev/test)
      MSSQL_COLLATION: Vietnamese_CI_AS # Collation hỗ trợ tiếng Việt (không phân biệt hoa thường, có phân biệt dấu)
      TZ: Asia/Ho_Chi_Minh # Múi giờ Việt Nam (GMT+7)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"] # Kiểm tra SQL Server đã nhận kết nối chưa
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 20s # SQL Server khởi động chậm hơn MariaDB nên cần thời gian chờ ban đầu
    ports:
      - '${SQLSERVER_PORT}:1433' # Ánh xạ cổng host (từ .env) vào cổng 1433 của container
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql # Lưu dữ liệu bền vững (đường dẫn dữ liệu của SQL Server)
    networks:
      - default

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest # Dùng lại image trên để có sẵn sqlcmd
    container_name: carzone_db_init
    depends_on:
      sqlserver:
        condition: service_healthy # Chỉ chạy khi SQL Server đã sẵn sàng
    environment:
      SQLCMDPASSWORD: ${SQLSERVER_SA_PASSWORD}
      DB_NAME: ${SQLSERVER_DATABASE}
    # SQL Server không tự tạo database qua biến môi trường như MariaDB, nên cần bước này
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa
      -Q \"IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME] COLLATE Vietnamese_CI_AS\""
    restart: 'no'
    networks:
      - default

  flyway:
    image: flyway/flyway:10 # Flyway 10 (đã tích hợp sẵn driver SQL Server)
    container_name: carzone_flyway
    depends_on:
      db-init:
        condition: service_completed_successfully # Chỉ chạy sau khi database đã được tạo xong
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${SQLSERVER_DATABASE};encrypt=true;trustServerCertificate=true # Chuỗi kết nối JDBC tới SQL Server
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../database/fly_way_migrations:/flyway/sql:ro # Mount thư mục migration ở chế độ chỉ đọc
    command: ["migrate"]
    restart: 'no'
    networks:
      - default

volumes:
  sqlserver_data:
    name: car_zone_sqlserver_data # Volume dữ liệu cho SQL Server

networks:
  default:
    name: car_zone_network # Mạng Docker chung cho các container