# ===========================================================================
# CẤU HÌNH SAO LƯU VÀ NHẬT KÝ KIỂM TOÁN (AUDIT) CARZONE
# ===========================================================================

# Thư mục sao lưu trên máy chủ SQL Server.
# Nếu SQL Server chạy trong Docker, đây là đường dẫn bên trong container SQL Server.
# Mặc định Docker SQL Server Linux hỗ trợ: /var/opt/mssql/data hoặc /var/opt/mssql/backup
backup.directory = /var/opt/mssql/backup

# Ngưỡng thời gian (phút): Nếu vừa có bản backup thành công trong vòng X phút, bỏ qua backup lúc thoát
backup.recent.threshold.minutes = 5

# Timeout khi sao lưu lúc thoát ứng dụng (giây)
backup.exit.timeout.seconds = 60

# Bật ghi log truy vấn SELECT (true: ghi ở DEBUG, false: tắt)
audit.log.select = false

# Danh sách tên tham số / cột nhạy cảm cần che (mask bằng ***)
audit.mask.fields = matKhau,password,matKhauMoi,cccd,token,secret,creditCard

# ===========================================================================
# CẤU HÌNH BẢO MẬT CẤP 2 & GIÁM SÁT HÀNH VI BẤT THƯỜNG (SECURITY & PIN)
# ===========================================================================

# Mã PIN bảo mật cấp 2 mặc định: 888888 (chuỗi hex băm SHA-256)
security.pin.hash = 92925488B28AB12584AC8FCAA8A27A0F497B2C62940C8F4FBC8EF19EBC87C43E
security.pin.max.attempts = 3

# Ngưỡng phát hiện xóa hàng loạt (Mass Delete): >= 3 lệnh xóa trong vòng 2000ms
security.anomaly.velocity.delete.threshold = 3
security.anomaly.velocity.delete.window.ms = 2000

# Khung giờ làm việc / ngoài giờ hành chính (00:00 - 05:00 sáng)
security.anomaly.offhours.start = 00:00
security.anomaly.offhours.end = 05:00

# Kênh cảnh báo an ninh ntfy.sh / webhook
security.alert.ntfy.server = https://ntfy.sh
security.alert.ntfy.topic = carzone-security-alerts

# Thời gian miễn trừ tạm thời sau khi nhập đúng mã PIN (ms)
security.whitelist.duration.ms = 60000

# Tự động khôi phục (Auto-Restore) CSDL về bản sao lưu sạch khi phát hiện phá hoại / nhập sai PIN 3 lần
security.auto.restore.enabled = true



